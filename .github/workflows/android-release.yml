name: Android Release Build

'on':
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release version tag (e.g. v0.1.0-beta01)'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Pin third-party actions to reviewed commit SHAs before production use.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Gradle wrapper execute permission
        run: chmod +x ./gradlew

      - name: Validate signing secrets presence
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          MISSING_SECRETS=""
          if [ -z "$KEYSTORE_BASE64" ]; then
            MISSING_SECRETS="${MISSING_SECRETS} RELEASE_KEYSTORE_BASE64"
          fi
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            MISSING_SECRETS="${MISSING_SECRETS} RELEASE_KEYSTORE_PASSWORD"
          fi
          if [ -z "$KEY_ALIAS" ]; then
            MISSING_SECRETS="${MISSING_SECRETS} RELEASE_KEY_ALIAS"
          fi
          if [ -z "$KEY_PASSWORD" ]; then
            MISSING_SECRETS="${MISSING_SECRETS} RELEASE_KEY_PASSWORD"
          fi

          if [ -n "$MISSING_SECRETS" ]; then
            echo "::error::Required release signing secrets are missing:$MISSING_SECRETS"
            exit 1
          fi
          echo "All required release signing secret names are verified present."

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          KEYSTORE_FILE="${{ runner.temp }}/release.keystore"
          # Decode keystore without echoing contents or enabling shell tracing
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_FILE"
          chmod 600 "$KEYSTORE_FILE"

          if [ ! -s "$KEYSTORE_FILE" ]; then
            echo "::error::Decoded keystore file is empty or missing."
            exit 1
          fi
          echo "Release keystore decoded successfully with restricted permissions."

      - name: Run unit tests and lint
        run: ./gradlew clean test lint

      - name: Build signed release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          REQUIRE_RELEASE_SIGNING: "true"
        run: |
          ./gradlew assembleRelease -PrequireReleaseSigning=true

      - name: Verify signed release artifact existence
        run: |
          SIGNED_APK="app/build/outputs/apk/release/app-release.apk"
          UNSIGNED_APK="app/build/outputs/apk/release/app-release-unsigned.apk"

          if [ -f "$UNSIGNED_APK" ]; then
            echo "::error::An unsigned APK was generated instead of a signed release artifact."
            exit 1
          fi

          if [ ! -f "$SIGNED_APK" ]; then
            echo "::error::Expected signed release APK was not found at $SIGNED_APK."
            exit 1
          fi

          echo "Confirmed signed release APK exists at $SIGNED_APK."

      - name: Verify APK signature with apksigner
        run: |
          SIGNED_APK="app/build/outputs/apk/release/app-release.apk"

          # Discover latest apksigner in Android SDK
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          if [ -z "$APKSIGNER" ] || [ ! -x "$APKSIGNER" ]; then
            echo "::error::apksigner tool was not found in $ANDROID_HOME/build-tools."
            exit 1
          fi
          echo "Using apksigner at: $APKSIGNER"

          "$APKSIGNER" verify --verbose --print-certs "$SIGNED_APK"

      - name: Compute SHA-256 checksum
        run: |
          SIGNED_APK="app/build/outputs/apk/release/app-release.apk"
          CHECKSUM_FILE="app/build/outputs/apk/release/app-release.apk.sha256"

          sha256sum "$SIGNED_APK" > "$CHECKSUM_FILE"
          echo "=== Release Artifact Checksum ==="
          cat "$CHECKSUM_FILE"
          echo "================================="

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: keepbell-release-apk
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/app-release.apk.sha256
          retention-days: 14
          if-no-files-found: error

      - name: Clean up temporary keystore
        if: always()
        run: |
          KEYSTORE_FILE="${{ runner.temp }}/release.keystore"
          if [ -f "$KEYSTORE_FILE" ]; then
            shred -u "$KEYSTORE_FILE" 2>/dev/null || rm -f "$KEYSTORE_FILE"
            echo "Temporary release keystore file securely destroyed."
          else
            echo "No temporary keystore file to clean up."
          fi
